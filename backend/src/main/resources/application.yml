spring:
  application:
    name: medimate-pill-backend
  threads:
    virtual:
      enabled: true
  datasource:
    # 기본값은 설치 없이 도는 파일 H2(PostgreSQL 호환 모드)다. 운영은 MEDIMATE_DB_URL로 PostgreSQL을 준다.
    url: ${MEDIMATE_DB_URL:jdbc:h2:file:./data/medimate;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${MEDIMATE_DB_USER:sa}
    password: ${MEDIMATE_DB_PASSWORD:}
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: false

server:
  # 로그인이 없으므로 기본은 이 PC에서만 받는다. 에뮬레이터의 10.0.2.2도 여기로 들어온다.
  # 실제 폰으로 시험할 때만 MEDIMATE_BIND=0.0.0.0 으로 연다.
  address: ${MEDIMATE_BIND:127.0.0.1}
  port: ${PORT:8080}
  servlet:
    context-path: ${MEDIMATE_CONTEXT_PATH:}
  tomcat:
    max-swallow-size: 12MB

medimate:
  storage:
    dir: ${MEDIMATE_STORAGE_DIR:./data/files}
    retention-days: 7
    signed-url-minutes: 10
  limits:
    # 로그인이 없어 접속 IP 기준으로 센다.
    daily-pill: ${MEDIMATE_DAILY_PILL:50}
    uploads-per-hour: ${MEDIMATE_UPLOADS_PER_HOUR:120}
    daily-recognition: ${MEDIMATE_DAILY_RECOGNITION:30}
  pill:
    # pill-classifier 추론 서버 (run_server.bat)
    base-url: ${PILL_BASE_URL:http://localhost:8000}
    internal-key: ${PILL_INTERNAL_KEY:}
    timeout-seconds: 90
    bag-timeout-seconds: 150
  mfds:
    # 공공데이터포털 일반 인증키. e약은요 설명에 쓴다. 없으면 약 설명 없이 응답한다.
    service-key: ${MFDS_SERVICE_KEY:}
    service-key-file: ${MFDS_SERVICE_KEY_FILE:../pill-classifier/.mfds_service_key}
    base-url: ${MFDS_BASE_URL:}
  auth:
    # Firebase 프로젝트 ID. 넣으면 앱이 보낸 Firebase 로그인 토큰을 확인한다. 비우면 로그인 없이 받는다.
    firebase-project-id: ${FIREBASE_PROJECT_ID:}
    firebase-jwks-url: ${FIREBASE_JWKS_URL:}
