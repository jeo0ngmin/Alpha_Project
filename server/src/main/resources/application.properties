# 값은 모두 환경 변수(.env)에서 읽는다. 키 값을 이 파일에 적지 않는다.
server.port=8080
spring.application.name=medimate-server
# 요청 본문은 환자 정보라서 남기지 않는다
logging.level.org.springframework.web=WARN
spring.mvc.problemdetails.enabled=false

medimate.firebase-credentials=${FIREBASE_CREDENTIALS:/run/secrets/firebase.json}
medimate.claude-api-key=${CLAUDE_API_KEY:}
medimate.claude-allowed-models=${CLAUDE_ALLOWED_MODELS:claude-opus-5-5}
medimate.claude-max-tokens=${CLAUDE_MAX_TOKENS:4096}
medimate.claude-requests-per-hour=${CLAUDE_REQUESTS_PER_HOUR:60}
